{% extends "cabinet/base.html" %}
{% block cab %}
<h2 class="ph">Деректерді енгізу</h2>
<p class="sub" style="margin-bottom:0">Жетістік қосу үшін бағытты таңдаңыз.</p>
{% for title, cats in groups %}
<p class="grp">{{ title }}</p>
<div class="icards">
  {% for c in cats %}<a class="icard" href="{% url 'enter_form' c.slug %}"><svg class="ic"><use href="#{{ c.icon }}"/></svg><b>{{ c.name }}</b></a>{% endfor %}
</div>
{% endfor %}
{% endblock %}
