{% extends "panel/base.html" %}
{% block cab %}
<h2 class="ph">Мектептер ({{ items|length }})</h2>
<form class="filt" method="post">{% csrf_token %}
  <input name="name" placeholder="Мектеп атауы" required maxlength="200" aria-label="Мектеп атауы">
  <input name="district" placeholder="Аудан / қала" maxlength="100" aria-label="Аудан немесе қала">
  <button class="btn btn-gold btn-sm" type="submit">Қосу</button>
</form>
<div class="tblwrap"><table class="tbl">
<thead><tr><th>Мектеп</th><th>Аудан / қала</th><th class="num">Мұғалім</th></tr></thead>
<tbody>{% for s in items %}<tr><td>{{ s.name }}</td><td>{{ s.district|default:"—" }}</td><td class="num">{{ s.n }}</td></tr>
{% empty %}<tr><td colspan="3">Тізім бос.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
